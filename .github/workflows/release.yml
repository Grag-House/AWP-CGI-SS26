name: Release Build (APK)

on:
  push:
    branches: [ "main" ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Generate keystore file from secret
      - name: Decode Keystore
        run: echo "${{ secrets.RELEASE_KEY_JKS_BASE64 }}" | base64 -d > release-key.jks

      - name: Create .env for BuildConfig
        run: |
          echo "WEBVIEW_URL=${{ vars.WEBVIEW_URL }}" >> .env
          echo "HTTP_ALLOWED_IP=${{ vars.HTTP_ALLOWED_IP }}" >> .env
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> .env
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> .env
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> .env
          echo "MQTT_HOST=${{ secrets.MQTT_HOST }}" >> .env
          echo "MQTT_PORT=${{ secrets.MQTT_PORT }}" >> .env
          echo "MQTT_USERNAME=${{ secrets.MQTT_USERNAME }}" >> .env
          echo "MQTT_PASSWORD=${{ secrets.MQTT_PASSWORD }}" >> .env
          echo "DEFAULT_ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env

      - name: Run Checks (Lint, Detekt, Tests)
        run: ./gradlew lintDebug qualityCheck

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: temi-app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Dokka (Docs)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dokka-Docs
          path: app/build/dokka/html