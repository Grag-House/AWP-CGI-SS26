name: Android CI with Gradle

# Trigger for pushes und merge requests on main and dev
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # create .env file
      - name: Create .env for BuildConfig
        run: echo "WEBVIEW_URL=https://example.com/" >> .env |
          echo "HTTP_ALLOWED_IP=127.0.0.0" >> .env


      # android specific linting
      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace --build-cache --parallel


      # detekt linter + dokka
      - name: Run Code Analysis
        run: ./gradlew qualityCheck

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Detekt-Report
          path: app/build/reports/detekt/detekt-report.html

      # run unit tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace --build-cache --parallel

      # upload results (on failure)
      - name: Upload Reports (Lint & Tests)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html

      - name: Upload Dokka Documentation
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Dokka-Docs
          path: app/build/dokka/html
